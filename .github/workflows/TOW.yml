
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # أضف هذه الأسرار في: Settings > Secrets and variables > Actions
      WASSLA_STORE_PASSWORD: ${{ secrets.WASSLA_STORE_PASSWORD }}
      WASSLA_KEY_ALIAS: ${{ secrets.WASSLA_KEY_ALIAS }}
      WASSLA_KEY_PASSWORD: ${{ secrets.WASSLA_KEY_PASSWORD }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Restore keystore from secret (optional)
        env:
          KS_B64: ${{ secrets.WASSLA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/wasslatv.jks
            echo "Keystore restored from secret"
          else
            echo "No WASSLA_KEYSTORE_BASE64 secret: using app/wasslatv.jks from the repo if present"
          fi

      - name: Fetch hls.js (pinned) for offline playback
        run: |
          curl -fsSL https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js -o /tmp/hls.min.js \
            && grep -q "Hls" /tmp/hls.min.js \
            && cp /tmp/hls.min.js app/src/main/assets/js/lib/hls.min.js \
            && echo "hls.js bundled" \
            || echo "::warning::hls.js not bundled; the app will load it from the CDN at runtime"

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Check APK is signed
        run: |
          ls app/build/outputs/apk/release/
          if ls app/build/outputs/apk/release/*unsigned*.apk >/dev/null 2>&1; then
            echo "::error::APK is unsigned. Add the WASSLA_STORE_PASSWORD secret."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WasslaTV-apk
          path: app/build/outputs/apk/release/*.ap
